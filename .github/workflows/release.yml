# 打 v* 标签：构建 agentd 与 autoagents-relay（Linux 用静态链接的 musl，拷到哪都能跑），
# 用构建出来的程序把多机联调走一遍，连同 SHA256SUMS 发到 GitHub Releases。
# scripts/install-*.sh 就是从这里下载的。
# 手动触发（workflow_dispatch）只构建、联调、把产物留作 artifact：先空跑一遍看构建过不过，不发 Release。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARIES: agentd autoagents-relay

jobs:
  build:
    name: 构建 · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            zig: true
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装 cargo-zigbuild（交叉构建 musl 用）
        if: matrix.zig
        run: pip install cargo-zigbuild ziglang
      - name: 构建
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} -p autoagents-node
          else
            cargo build --release --locked --target ${{ matrix.target }} -p autoagents-node
          fi
      - name: 打包并生成校验值
        shell: bash
        run: |
          set -euo pipefail
          out="dist"
          mkdir -p "$out"
          archive="autoagents-node-${{ matrix.target }}.tar.gz"
          # COPYFILE_DISABLE：macOS 上别把 ._* 元数据文件打进包里（Linux 上没有影响）
          COPYFILE_DISABLE=1 tar -C "target/${{ matrix.target }}/release" -czf "$out/$archive" $BINARIES
          if command -v sha256sum >/dev/null; then
            (cd "$out" && sha256sum "$archive")
          else
            (cd "$out" && shasum -a 256 "$archive")
          fi > "$out/SHA256SUMS"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # 发出去之前，拿刚构建出来的两个程序把多机联调走一遍：配对、握手换长期密钥、
  # 凭密钥重连、转发请求、重启后仍连得上。Linux 的 musl 静态版在原生 Linux 上直接能跑
  smoke:
    name: 产物联调 · ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 选出这台机器能直接跑的那一份
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=x86_64-unknown-linux-musl ;;
            Darwin-arm64) target=aarch64-apple-darwin ;;
            *) echo "这台机器（$(uname -sm)）没有对应的构建" >&2; exit 1 ;;
          esac
          echo "target=${target}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ steps.pick.outputs.target }}
          path: dist
      - name: 解包
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "dist/autoagents-node-${{ steps.pick.outputs.target }}.tar.gz" -C dist
          dist/agentd --version
          dist/autoagents-relay --version
      - name: 用发布出去的两个程序走一遍多机联调
        env:
          AUTOAGENTS_TEST_RELAY: ${{ github.workspace }}/dist/autoagents-relay
          AUTOAGENTS_TEST_AGENTD: ${{ github.workspace }}/dist/agentd
        run: cargo test -p autoagents-node --test multimachine

  release:
    name: 发布
    needs: [build, smoke]
    # 只有打标签才发 Release；从分支手动触发时上面的构建和联调照跑，这里跳过
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
      - name: 汇总校验值，逐个核对
        run: |
          set -euo pipefail
          # 按文件名排，读起来顺眼；安装脚本按文件名去找对应的那一行
          cat dist/*/SHA256SUMS | sort -u -k2 > SHA256SUMS
          mkdir -p out
          mv dist/*/*.tar.gz out/
          (cd out && while read -r sum file; do echo "$sum  $file" | sha256sum -c -; done < ../SHA256SUMS)
          ls -la out
          cat SHA256SUMS
      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # 这个任务没有检出仓库，gh 自己认不出该发到哪儿，得直接告诉它
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 一行一行拼：直接写成多行字符串的话，后面几行会带着 YAML 的缩进，表格就被当成代码块了
          notes="$(
            printf '%s\n' \
              '## 节点程序' \
              '' \
              '| 平台 | 文件 |' \
              '| --- | --- |' \
              '| Linux x86_64（静态链接） | autoagents-node-x86_64-unknown-linux-musl.tar.gz |' \
              '| Linux arm64（静态链接） | autoagents-node-aarch64-unknown-linux-musl.tar.gz |' \
              '| macOS Intel | autoagents-node-x86_64-apple-darwin.tar.gz |' \
              '| macOS Apple Silicon | autoagents-node-aarch64-apple-darwin.tar.gz |' \
              '' \
              '每个压缩包里有 agentd（装在被管理的机器上）和 autoagents-relay（自建中继）。' \
              '一般不用手动下载：AutoAgents「机器」页生成的安装命令会自动取对应平台的版本并校验 SHA256SUMS。' \
              '' \
              '桌面应用目前要从源码构建（`npm run tauri build`），见 README。'
          )"
          # 同一个标签重跑时补充上传
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" out/*.tar.gz SHA256SUMS \
              --title "AutoAgents $TAG" \
              --generate-notes \
              --notes "$notes"
          fi

  # 发出去之后照用户的方式装一遍：安装脚本从 main 取，程序从刚发布的 Release 取。
  # 装到临时目录，不注册服务、不启动
  verify:
    name: 发布之后实际装一遍 · ${{ matrix.name }}
    needs: release
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: 按安装命令装 agentd 与中继
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/main/scripts"
          export AUTOAGENTS_INSTALL_DIR="${RUNNER_TEMP}/autoagents-bin"
          curl -fsSL "${base}/install-agentd.sh" | sh -s -- upgrade
          curl -fsSL "${base}/install-relay.sh" | sh -s -- --public wss://relay.example.com:7000
